name: CI/CD Pipeline for My Tech App

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: monabawi/my-tech-app

jobs:
  build_and_push:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Short SHA
        run: echo "SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./my-tech-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.SHA }}
            ${{ env.IMAGE_NAME }}:latest
    
    outputs:
      sha: ${{ env.SHA }}

  deploy_to_k8s:
    needs: build_and_push
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Substitute deployment values
        run: |
          export SHA="${{ needs.build_and_push.outputs.sha }}"
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:$SHA|g" my-tech-app/k8s/deployment.yml
          sed -i "s|value: \".*\" # APP_VERSION_MARKER|value: \"$SHA\" # APP_VERSION_MARKER|g" my-tech-app/k8s/deployment.yml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f my-tech-app/k8s/deployment.yml
          kubectl apply -f my-tech-app/k8s/service.yml